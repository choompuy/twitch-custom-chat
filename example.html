<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.streamelements.com/scripts/jquery_3.3.1.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>

  <body style="background-color: black">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@200..900&display=swap" rel="stylesheet" />
    <div id="chat" style="width: 300px; height: 400px; margin-left: 100px; resize: horizontal"></div>
    <div style="margin-top: 100px">
      <button id="add-event">Add Event</button>
      <button id="clear-chat">Clear Chat</button>
    </div>

    <template id="message-template">
      <div class="message">
        <div class="username-wrapper">
          <div class="username">
            <span class="badges"></span>
            <span class="username-text"></span>
          </div>
        </div>

        <div class="message-panel">
          <div class="text-wrapper">
            <span class="text-top"></span>
            <span class="text-bottom"></span>

            <span class="text"></span>
          </div>
        </div>

        <div class="event-wrapper">
          <span class="event-text"></span>
        </div>
      </div>
    </template>

    <script src="script.js"></script>

    <script>
      function fireEvent(detail) {
        window.dispatchEvent(new CustomEvent("onEventReceived", { detail }));
      }

      function nextFrame() {
        return new Promise((res) => requestAnimationFrame(() => requestAnimationFrame(res)));
      }

      function clearChat() {
        document.getElementById("chat").innerHTML = "";
      }

      function addEvent(run) {
        run().then(() => {
          console.log("Event added");
        });
      }

      document.getElementById("clear-chat").addEventListener("click", () => {
        clearChat();
      });

      document.getElementById("add-event").addEventListener("click", () => {
        addEvent(async () => {
          const loremLong =
            "Lorem ipsum dolor sit amet consectetur adipisicing elit. Adipisci harum impedit saepe nihil sit autem unde delectus assumenda, vero placeat voluptas, deleniti quibusdam culpa temporibus quisquam, consequatur blanditiis veritatis modi.";
          const loremMedium = "Lorem ipsum dolor sit amet, consectetur adipisicing elit. Laborum sed accusamus voluptates. Dolores, sit id?";
          const loremShort = "Loremipsum";

          const data = {
            displayName: loremShort,
            displayColor: "#FF7F50",
            badges: [],
            text: Math.random() > 0.5 ? loremLong : loremMedium,
            emotes: [],
            tags: { "first-msg": Math.random() > 0.5 ? "1" : "0" },
          };
          fireEvent({ listener: "message", event: { data } });
          await nextFrame();
        });
      });
    </script>
  </body>
</html>
