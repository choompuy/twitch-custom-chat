<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Scripts -->
    <script src="https://cdn.streamelements.com/scripts/jquery_3.3.1.min.js"></script>
    <!-- CSS -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap");

      :root {
        --panel-bg: #0a0a0a;

        --z-background: 1;
        --z-overlay: 2;
        --z-content: 3;

        --radius-user: 6px;
        --radius-message: 4px 4px 16px 16px;

        --username-corner-top-left: url("https://dl.dropboxusercontent.com/scl/fi/4m5gdwbb1k5r299x762nj/username-corner-top-left.png?rlkey=3zpxow81vnaweqffovx7ygmcj&st=a16ck2ru&dl=0");
        --username-mask: url("https://dl.dropboxusercontent.com/scl/fi/9w5l9yl3zhkwq1fuqa86s/username-mask.png?rlkey=2x97io7y5zb1pz5zys4dyvs8q&st=nx9zol6j&dl=0");
        --message-corner-top-right: url("https://dl.dropboxusercontent.com/scl/fi/6l3jrfnwpzzxtfk8n2twu/message-corner-top-right.png?rlkey=z6dah9qe4j9dcdpzsljyu0y1h&st=yc61n763&dl=0");
        --message-corner-bottom-left: url("https://dl.dropboxusercontent.com/scl/fi/xw3yxxe4z87ix2vwf1hot/message-corner-bottom-left.png?rlkey=y5p9yrlrac8jrjcokktk0l28k&st=jmp5vfmy&dl=0");
        --message-mask: url("https://dl.dropboxusercontent.com/scl/fi/8w5isfgtwln1pmooxyba1/message-mask.png?rlkey=zd4bvr2sbynklehab0kuiji6p&st=gavhwst3&dl=0");
        --fog-top: url("https://dl.dropboxusercontent.com/scl/fi/l05zgfj1d2po0cx7qz1c3/fog-top.png?rlkey=mwt9h3jvomr4n5hpq970uk5w6&st=szg63viu&dl=0");
        --fog-bottom: url("https://dl.dropboxusercontent.com/scl/fi/a2yhnn6wgv5whts328itl/fog-bottom.png?rlkey=zfknzzothzc8ii2zxwkbf6d3x&st=pj7i3tvq&dl=0");
      }

      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: "Rajdhani", sans-serif;
      }

      #chat {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        width: 100%;
        height: 100%;
        padding-bottom: 6px;
        padding-inline: 4px;
        gap: 16px;
        box-sizing: border-box;
        overflow: hidden;
      }

      .message {
        position: relative;
        animation: messageEnter 400ms cubic-bezier(0.22, 1, 0.36, 1);
        transform-origin: top left;
      }

      @keyframes messageEnter {
        0% {
          opacity: 0;
          transform: translateX(30px) scale(0.95);
        }

        100% {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      .message-removing {
        animation: messageExit 300ms ease forwards;
      }

      @keyframes messageExit {
        from {
          opacity: 1;
          transform: translateX(0);
        }

        to {
          opacity: 0;
          transform: translateX(-30px);
        }
      }

      .chat-emote {
        display: inline-block;
        width: auto;
        height: 28px;
        max-height: 28px;
        vertical-align: middle;
        image-rendering: auto;
      }

      .username-wrapper {
        position: absolute;
        display: inline-flex;
        margin-left: 6px;
        top: -8px;
        padding: 2px;
        border-radius: var(--radius-user);
        background: linear-gradient(39deg, #302f2f 0%, #7d7777 21%, #2a2a2a 58%, #4d4745 100%);
        z-index: var(--z-content);
      }

      .username-wrapper::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: repeat-x var(--username-mask);
        background-size: contain;
        pointer-events: none;
        z-index: var(--z-overlay);
      }

      .username-corner-top-left {
        position: absolute;
        top: -6px;
        left: -4px;
        width: 23px;
        height: 30px;
        background: no-repeat var(--username-corner-top-left);
        background-size: contain;
        pointer-events: none;
        z-index: var(--z-content);
      }

      .username {
        display: flex;
        align-items: center;
        border-radius: inherit;
        font-weight: 700;
        overflow: hidden;
      }

      .badges {
        display: flex;
        align-items: center;
        height: 100%;
        gap: 4px;
        padding: 4px;
        padding-left: 8px;
        background: var(--panel-bg);
      }

      .badges img {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      .username-text {
        padding: 4px 8px 4px 6px;
        text-shadow: 0 0 4px currentColor;
      }

      .message-panel {
        position: relative;
        padding: 2px;
        border-radius: var(--radius-message);
        background: linear-gradient(50deg, #302f2f 0%, #5c5554 19%, #2a2a2a 48%, #353230 74%, #969393 100%);
      }

      .message-panel::before {
        content: "";
        position: absolute;
        top: -4px;
        right: -4px;
        width: 48px;
        height: 60px;
        background: no-repeat var(--message-corner-top-right);
        background-size: contain;
        pointer-events: none;
        z-index: var(--z-overlay);
      }

      .message-panel::after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: -6px;
        width: 121px;
        height: 70px;
        background: no-repeat var(--message-corner-bottom-left);
        background-size: contain;
        pointer-events: none;
        z-index: var(--z-overlay);
      }

      .text-wrapper {
        position: relative;
        padding: 28px 14px 14px;
        border-radius: inherit;
        background: var(--panel-bg);
        color: #fff;
        overflow: hidden;
      }

      .text-wrapper::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeat-y var(--message-mask);
        background-size: contain;
        pointer-events: none;
        z-index: var(--z-overlay);
      }

      .text-top,
      .text-bottom {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        z-index: var(--z-background);
      }

      .text-top {
        background: no-repeat top center var(--fog-top);
        background-size: cover;
      }

      .text-bottom {
        background: no-repeat bottom center var(--fog-bottom);
        background-size: cover;
      }

      .text {
        position: relative;
        z-index: var(--z-content);
        line-height: 1.4;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" />
    <div id="chat"></div>

    <template id="message-template">
      <div class="message">
        <div class="username-wrapper">
          <span class="username-corner-top-left"></span>
          <span class="username-left"></span>

          <div class="username">
            <span class="badges"></span>
            <span class="username-text"></span>
          </div>
        </div>

        <div class="message-panel">
          <div class="text-wrapper">
            <span class="text-top"></span>
            <span class="text-bottom"></span>

            <span class="text"></span>
          </div>
        </div>
      </div>
    </template>

    <script>
      const MAX_MESSAGES = 10;
      const MESSAGE_LIFETIME = 15000;
      const DEFAULT_COLOR = "#00ff88";

      const chat = document.getElementById("chat");
      const template = document.getElementById("message-template");
      const badgeCache = new Map();

      window.addEventListener("onEventReceived", ({ detail }) => {
        if (detail.listener !== "message") return;

        renderMessage(detail.event.data);
      });

      function getBadgesHTML(badges) {
        if (!badges?.length) return "";

        const key = badges.map((b) => b.url).join("|");
        let html = badgeCache.get(key);
        if (html) return html;

        html = badges.map((b) => `<img src="${b.url}" alt="">`).join("");
        badgeCache.set(key, html);
        return html;
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function renderMessageContent(text, emotes = []) {
        if (!emotes.length) {
          return escapeHtml(text);
        }

        let result = "";
        let lastIndex = 0;

        for (const emote of emotes) {
          result += escapeHtml(text.slice(lastIndex, emote.start));
          result += `
              <img
                class="chat-emote"
                src="${emote.urls["1"] || emote.urls["2"] || emote.urls["4"]}"
                alt="${emote.name}"
              >
            `;

          lastIndex = emote.end + 1;
        }

        result += escapeHtml(text.slice(lastIndex));
        return result;
      }

      function renderMessage(data) {
        const color = data.displayColor || DEFAULT_COLOR;
        const message = template.content.firstElementChild.cloneNode(true);

        // -------------------------
        // Cached nodes
        // -------------------------

        message.dataset.created = Date.now();
        const username = message.querySelector(".username");
        const usernameText = message.querySelector(".username-text");
        const badges = message.querySelector(".badges");
        const text = message.querySelector(".text");

        // -------------------------
        // Username
        // -------------------------

        username.style.color = color;
        username.style.backgroundColor = `color-mix(in srgb, #000000 100%, ${color} 30%)`;
        usernameText.textContent = data.displayName || "";

        // -------------------------
        // Badges
        // -------------------------

        badges.innerHTML = getBadgesHTML(data.badges);

        // -------------------------
        // Message text
        // -------------------------

        text.innerHTML = renderMessageContent(data.text, data.emotes);

        // -------------------------
        // Add to DOM
        // -------------------------

        chat.appendChild(message);

        // -------------------------
        // Remove old messages
        // -------------------------

        while (chat.children.length > MAX_MESSAGES) {
          chat.firstElementChild.remove();
        }
      }

      setInterval(() => {
        const now = Date.now();

        for (const message of chat.children) {
          if (now - Number(message.dataset.created) > MESSAGE_LIFETIME) {
            message.classList.add("message-removing");
          }
        }
      }, 1000);
    </script>
  </body>
</html>
