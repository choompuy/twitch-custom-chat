<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Scripts -->
    <script src="https://cdn.streamelements.com/scripts/jquery_3.3.1.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@200..900&display=swap" rel="stylesheet" />
    <div id="chat"></div>

    <template id="message-template">
      <div class="message">
        <div class="username-wrapper">
          <div class="username">
            <span class="badges"></span>
            <span class="username-text"></span>
          </div>
        </div>

        <div class="message-panel">
          <div class="text-wrapper">
            <span class="text-top"></span>
            <span class="text-bottom"></span>

            <span class="text"></span>
          </div>
        </div>
      </div>
    </template>

    <script src="script.js"></script>
  </body>
</html>
